<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexum · Arquitetura</title>
<style>
body{font:1rem system-ui;background:#f1f5f6;color:#173648;margin:2rem auto;padding:0 1rem;max-width:1000px}
textarea{display:block;width:100%;box-sizing:border-box;margin:.5rem 0;padding:.75rem}
button{font:inherit;padding:.55rem 1rem;background:#173648;color:white;border:0;border-radius:.25rem}
.diagram{overflow:auto;background:white;border:1px solid #c8d6dc}
</style>
<h1>Nexum · Arquitetura</h1>
<form>
<label for="model">Modelo JSON</label>
<textarea id="model" rows="9" spellcheck="false">{
  "components": [
    {"id": "web", "label": "Interface"},
    {"id": "api", "label": "Serviço"},
    {"id": "db", "label": "Banco"}
  ],
  "links": [{"from":"web","to":"api"},{"from":"api","to":"db"}]
}</textarea>
<button>Renderizar</button>
</form>
<p id="status" role="status"></p>
<div class="diagram"><canvas aria-label="Diagrama de componentes"></canvas></div>
<h2>Conexões</h2>
<ul></ul>
<script type="module" src="./dist/app.js"></script>
</html>
