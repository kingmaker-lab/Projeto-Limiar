name: CERBERUS C backup
on:
  push:
    paths:
      - "cerberus/phase-ii/c-backup/**"
      - "cerberus/phase-ii/cerberus/**"
      - ".github/workflows/cerberus-c-backup.yml"
  pull_request:
    paths:
      - "cerberus/phase-ii/c-backup/**"
      - "cerberus/phase-ii/cerberus/**"
      - ".github/workflows/cerberus-c-backup.yml"
permissions:
  contents: read
jobs:
  backup-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: debian:13-slim
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential libsqlite3-dev python3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: make -C c-backup test
        working-directory: cerberus/phase-ii
